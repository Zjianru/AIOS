# T009.H2：慢测试判定；单测超过 5 秒记为 SLOW，连续 6 个周期（约 30 秒）没结束就杀掉。
[profile.default]
slow-timeout = { period = "5s", terminate-after = 6 }

# 真 key 的慢测试只在本地/DoD 跑，按名字放宽（常规门禁不命中）。
[[profile.default.overrides]]
filter = 'test(/real_key|real-key|真_key/)'
slow-timeout = { period = "180s", terminate-after = 2 }

# T054：service::it 的整链用例要起假模型/回放并等第一轮收尾；整套并发下偶尔超过默认
# 30 秒被杀。给 service 包更长的慢测试预算（10s 记慢，60s 才杀），其余包保持原样。
[[profile.default.overrides]]
filter = 'package(service)'
slow-timeout = { period = "10s", terminate-after = 6 }
