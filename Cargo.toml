[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# T013.1：diff 展示（spec 允许的唯一新依赖；tools crate 正式依赖）
similar = "2.7.0"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"] }
# charset：网页正文按 Content-Type 声明的编码解码。
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream", "charset"] }
# 网页 HTML 转 Markdown；Apache-2.0，维护中的成熟实现。
htmd = "0.5.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "=12.0.1", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.26", features = ["v4"] }
thiserror = "2.0"
ignore = "0.4"
globset = "0.4"
axum = { version = "0.8.9", features = ["ws"] }
grep-regex = "0.1"
grep-searcher = "0.1"
wiremock = "0.6"
insta = { version = "1.49", features = ["json"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
let_underscore_must_use = "warn"
