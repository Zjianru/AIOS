[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.26", features = ["v4"] }
thiserror = "2.0"
ignore = "0.4"
globset = "0.4"
axum = { version = "0.8.9", features = ["ws"] }
grep-regex = "0.1"
grep-searcher = "0.1"
wiremock = "0.6"
insta = { version = "1.49", features = ["json"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
uninlined_format_args = "warn"
collapsible_if = "warn"
redundant_closure_for_method_calls = "warn"
